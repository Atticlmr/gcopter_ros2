gcopter_ros2_planner:
  ros__parameters:
    # ROS2 names are snake_case. See docs/GCOPTER_ROS2_ADAPTATION.md for ROS1 parameter mapping.
    map_topic: /mock_map
    target_topic: /move_base_simple/goal
    marker_frame: map

    dilate_radius: 0.5
    voxel_width: 0.25
    map_bound: [-25.0, 25.0, -25.0, 25.0, 0.0, 5.0]
    timeout_rrt: 0.02
    max_vel_mag: 4.0
    max_bdr_mag: 2.1
    max_tilt_angle: 1.05
    min_thrust: 2.0
    max_thrust: 12.0
    vehicle_mass: 0.61
    grav_acc: 9.8
    horiz_drag: 0.70
    vert_drag: 0.80
    paras_drag: 0.01
    speed_eps: 0.0001
    weight_t: 20.0
    chi_vec: [1.0e+4, 1.0e+4, 1.0e+4, 1.0e+4, 1.0e+5]
    smoothing_eps: 1.0e-2
    integral_intervs: 16
    rel_cost_tol: 1.0e-5
